version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
  mvp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      - rabbitmq
    environment:
      - QUEUE_URL=amqp://guest:guest@rabbitmq:5672/
      - QUEUE_EXCHANGE=security.events
    ports:
      - "8080:8080"
